<svg id="fixture-preview-pie" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 450" style="max-width: 512px;" role="graphics-document document" aria-roledescription="pie"><style>#fixture-preview-pie{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-preview-pie .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-preview-pie .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-preview-pie .error-icon{fill:#552222;}#fixture-preview-pie .error-text{fill:#552222;stroke:#552222;}#fixture-preview-pie .edge-thickness-normal{stroke-width:1px;}#fixture-preview-pie .edge-thickness-thick{stroke-width:3.5px;}#fixture-preview-pie .edge-pattern-solid{stroke-dasharray:0;}#fixture-preview-pie .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-preview-pie .edge-pattern-dashed{stroke-dasharray:3;}#fixture-preview-pie .edge-pattern-dotted{stroke-dasharray:2;}#fixture-preview-pie .marker{fill:#333333;stroke:#333333;}#fixture-preview-pie .marker.cross{stroke:#333333;}#fixture-preview-pie svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture-preview-pie p{margin:0;}#fixture-preview-pie .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#fixture-preview-pie .pieCircle.highlighted{scale:1.05;opacity:1;}#fixture-preview-pie .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#fixture-preview-pie .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#fixture-preview-pie .pieTitleText{text-anchor:middle;font-size:25px;fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture-preview-pie .slice{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;font-size:17px;}#fixture-preview-pie .legend text{fill:black;font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:17px;}#fixture-preview-pie .node .neo-node{stroke:#9370DB;}#fixture-preview-pie [data-look="neo"].node rect,#fixture-preview-pie [data-look="neo"].cluster rect,#fixture-preview-pie [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-preview-pie [data-look="neo"].swimlane.cluster rect{filter:none;}#fixture-preview-pie [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture-preview-pie [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-preview-pie [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture-preview-pie [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-preview-pie [data-look="neo"].node circle .state-start{fill:#000000;}#fixture-preview-pie [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-preview-pie [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-preview-pie :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"></circle><path d="M0,-185A185,185,0,0,1,108.74,149.668L0,0Z" fill="#ECECFF" class="pieCircle"></path><path d="M108.74,149.668A185,185,0,1,1,0,-185L0,0Z" fill="#ffffde" class="pieCircle"></path><text transform="translate(131.95909163595255,-42.87610796952395)" style="text-anchor: middle;" class="slice">40%</text><text transform="translate(-131.95909163595255,42.876107969523964)" style="text-anchor: middle;" class="slice">60%</text></g><text x="0" y="-200" class="pieTitleText"></text><g class="legend" transform="translate(216,-22)"><rect width="18" height="18" style="fill: #ECECFF; stroke: #ECECFF;"></rect><text x="22" y="14">One</text></g><g class="legend" transform="translate(216,0)"><rect width="18" height="18" style="fill: #ffffde; stroke: #ffffde;"></rect><text x="22" y="14">Two</text></g></g></svg>