<svg id="fixture-preview-gantt" width="100%" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 0 124" style="max-width: 0px;" role="graphics-document document" aria-roledescription="gantt"><style>#fixture-preview-gantt{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#fixture-preview-gantt .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#fixture-preview-gantt .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#fixture-preview-gantt .error-icon{fill:#552222;}#fixture-preview-gantt .error-text{fill:#552222;stroke:#552222;}#fixture-preview-gantt .edge-thickness-normal{stroke-width:1px;}#fixture-preview-gantt .edge-thickness-thick{stroke-width:3.5px;}#fixture-preview-gantt .edge-pattern-solid{stroke-dasharray:0;}#fixture-preview-gantt .edge-thickness-invisible{stroke-width:0;fill:none;}#fixture-preview-gantt .edge-pattern-dashed{stroke-dasharray:3;}#fixture-preview-gantt .edge-pattern-dotted{stroke-dasharray:2;}#fixture-preview-gantt .marker{fill:#333333;stroke:#333333;}#fixture-preview-gantt .marker.cross{stroke:#333333;}#fixture-preview-gantt svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#fixture-preview-gantt p{margin:0;}#fixture-preview-gantt .mermaid-main-font{font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture-preview-gantt .exclude-range{fill:#eeeeee;}#fixture-preview-gantt .section{stroke:none;opacity:0.2;}#fixture-preview-gantt .section0{fill:rgba(102, 102, 255, 0.49);}#fixture-preview-gantt .section2{fill:#fff400;}#fixture-preview-gantt .section1,#fixture-preview-gantt .section3{fill:white;opacity:0.2;}#fixture-preview-gantt .sectionTitle0{fill:#333;}#fixture-preview-gantt .sectionTitle1{fill:#333;}#fixture-preview-gantt .sectionTitle2{fill:#333;}#fixture-preview-gantt .sectionTitle3{fill:#333;}#fixture-preview-gantt .sectionTitle{text-anchor:start;font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture-preview-gantt .grid .tick{stroke:lightgrey;opacity:0.8;shape-rendering:crispEdges;}#fixture-preview-gantt .grid .tick text{font-family:"trebuchet ms",verdana,arial,sans-serif;fill:#333;}#fixture-preview-gantt .grid path{stroke-width:0;}#fixture-preview-gantt .today{fill:none;stroke:red;stroke-width:2px;}#fixture-preview-gantt .task{stroke-width:2;}#fixture-preview-gantt .taskText{text-anchor:middle;font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture-preview-gantt .taskTextOutsideRight{fill:black;text-anchor:start;font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture-preview-gantt .taskTextOutsideLeft{fill:black;text-anchor:end;}#fixture-preview-gantt .task.clickable{cursor:pointer;}#fixture-preview-gantt .taskText.clickable{cursor:pointer;fill:#003163!important;font-weight:bold;}#fixture-preview-gantt .taskTextOutsideLeft.clickable{cursor:pointer;fill:#003163!important;font-weight:bold;}#fixture-preview-gantt .taskTextOutsideRight.clickable{cursor:pointer;fill:#003163!important;font-weight:bold;}#fixture-preview-gantt .taskText0,#fixture-preview-gantt .taskText1,#fixture-preview-gantt .taskText2,#fixture-preview-gantt .taskText3{fill:white;}#fixture-preview-gantt .task0,#fixture-preview-gantt .task1,#fixture-preview-gantt .task2,#fixture-preview-gantt .task3{fill:#8a90dd;stroke:#534fbc;}#fixture-preview-gantt .taskTextOutside0,#fixture-preview-gantt .taskTextOutside2{fill:black;}#fixture-preview-gantt .taskTextOutside1,#fixture-preview-gantt .taskTextOutside3{fill:black;}#fixture-preview-gantt .active0,#fixture-preview-gantt .active1,#fixture-preview-gantt .active2,#fixture-preview-gantt .active3{fill:#bfc7ff;stroke:#534fbc;}#fixture-preview-gantt .activeText0,#fixture-preview-gantt .activeText1,#fixture-preview-gantt .activeText2,#fixture-preview-gantt .activeText3{fill:black!important;}#fixture-preview-gantt .done0,#fixture-preview-gantt .done1,#fixture-preview-gantt .done2,#fixture-preview-gantt .done3{stroke:grey;fill:lightgrey;stroke-width:2;}#fixture-preview-gantt .doneText0,#fixture-preview-gantt .doneText1,#fixture-preview-gantt .doneText2,#fixture-preview-gantt .doneText3{fill:black!important;}#fixture-preview-gantt .doneText0.taskTextOutsideLeft,#fixture-preview-gantt .doneText0.taskTextOutsideRight,#fixture-preview-gantt .doneText1.taskTextOutsideLeft,#fixture-preview-gantt .doneText1.taskTextOutsideRight,#fixture-preview-gantt .doneText2.taskTextOutsideLeft,#fixture-preview-gantt .doneText2.taskTextOutsideRight,#fixture-preview-gantt .doneText3.taskTextOutsideLeft,#fixture-preview-gantt .doneText3.taskTextOutsideRight{fill:black!important;}#fixture-preview-gantt .crit0,#fixture-preview-gantt .crit1,#fixture-preview-gantt .crit2,#fixture-preview-gantt .crit3{stroke:#ff8888;fill:red;stroke-width:2;}#fixture-preview-gantt .activeCrit0,#fixture-preview-gantt .activeCrit1,#fixture-preview-gantt .activeCrit2,#fixture-preview-gantt .activeCrit3{stroke:#ff8888;fill:#bfc7ff;stroke-width:2;}#fixture-preview-gantt .doneCrit0,#fixture-preview-gantt .doneCrit1,#fixture-preview-gantt .doneCrit2,#fixture-preview-gantt .doneCrit3{stroke:#ff8888;fill:lightgrey;stroke-width:2;cursor:pointer;shape-rendering:crispEdges;}#fixture-preview-gantt .milestone{transform:rotate(45deg) scale(0.8,0.8);}#fixture-preview-gantt .milestoneText{font-style:italic;}#fixture-preview-gantt .doneCritText0,#fixture-preview-gantt .doneCritText1,#fixture-preview-gantt .doneCritText2,#fixture-preview-gantt .doneCritText3{fill:black!important;}#fixture-preview-gantt .doneCritText0.taskTextOutsideLeft,#fixture-preview-gantt .doneCritText0.taskTextOutsideRight,#fixture-preview-gantt .doneCritText1.taskTextOutsideLeft,#fixture-preview-gantt .doneCritText1.taskTextOutsideRight,#fixture-preview-gantt .doneCritText2.taskTextOutsideLeft,#fixture-preview-gantt .doneCritText2.taskTextOutsideRight,#fixture-preview-gantt .doneCritText3.taskTextOutsideLeft,#fixture-preview-gantt .doneCritText3.taskTextOutsideRight{fill:black!important;}#fixture-preview-gantt .vert{stroke:navy;}#fixture-preview-gantt .vertText{font-size:15px;text-anchor:middle;fill:navy!important;}#fixture-preview-gantt .activeCritText0,#fixture-preview-gantt .activeCritText1,#fixture-preview-gantt .activeCritText2,#fixture-preview-gantt .activeCritText3{fill:black!important;}#fixture-preview-gantt .titleText{text-anchor:middle;font-size:18px;fill:#333;font-family:"trebuchet ms",verdana,arial,sans-serif;}#fixture-preview-gantt .node .neo-node{stroke:#9370DB;}#fixture-preview-gantt [data-look="neo"].node rect,#fixture-preview-gantt [data-look="neo"].cluster rect,#fixture-preview-gantt [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-preview-gantt [data-look="neo"].swimlane.cluster rect{filter:none;}#fixture-preview-gantt [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#fixture-preview-gantt [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-preview-gantt [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#fixture-preview-gantt [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-preview-gantt [data-look="neo"].node circle .state-start{fill:#000000;}#fixture-preview-gantt [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-preview-gantt [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#fixture-preview-gantt :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g></g><g class="grid" transform="translate(75, 74)" fill="none" font-size="10" font-family="sans-serif" text-anchor="middle"><path class="domain" stroke="currentColor" d="M0.5,-39V0.5